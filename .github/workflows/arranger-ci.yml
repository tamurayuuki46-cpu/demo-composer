name: Arrangement Lab CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'arranger/**'
      - 'src/**'
      - 'project-home/**'
      - 'scripts/browser-export-regression.cjs'
      - 'scripts/song-data-menu-public-smoke-test.mjs'
      - '.github/workflows/arranger-ci.yml'

jobs:
  arranger-v06:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax check
        run: |
          node --check arranger/src/core.js
          node --check arranger/src/app.js
          node --check arranger/sw.js
          node --check arranger/src/preview.js
          node --check arranger/src/reharm-theory.js
          node --check arranger/src/arrangement-tools.js
          node --check arranger/src/feature-ui.js
          node --check arranger/src/v05-tools.js
          node --check arranger/src/v05-workflow.js
          node --check arranger/src/v05-ui.js
          node --check arranger/src/workflow-boundary-ui.js
          node --check arranger/src/beginner-flow.js
          node --check arranger/src/song-project-sync.js
          node --check src/shared/song-data-menu.js
          node --check src/hub/song-data-menu-entry.js
          node --check project-home/song-data-menu-entry.js
          node --check arranger/src/song-data-menu-entry.js
          for file in arranger/src/*lab*.js; do node --check "$file"; done

      - name: Arrangement Lab core regression
        run: |
          node arranger/tests/core.test.mjs
          node arranger/tests/regression.test.mjs
          node arranger/tests/features.test.mjs
          node arranger/tests/music-labs.test.mjs
          node arranger/tests/v05.test.mjs
          node arranger/tests/v05-workflow.test.mjs
          node arranger/tests/song-project-quick-sketch.test.mjs
          node scripts/song-data-menu-public-smoke-test.mjs

      - name: Static build includes Arrangement Lab
        run: |
          npm run build
          test -f dist/arranger/index.html
          test -f dist/arranger/v05.css
          test -f dist/arranger/v06.css
          test -f dist/arranger/src/app.js
          test -f dist/arranger/src/core.js
          test -f dist/arranger/src/v05-tools.js
          test -f dist/arranger/src/v05-workflow.js
          test -f dist/arranger/src/v05-ui.js
          test -f dist/arranger/src/workflow-boundary-ui.js
          test -f dist/arranger/src/beginner-flow.js
          test -f dist/arranger/src/song-project-sync.js

      - name: Mobile Chromium end-to-end
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --directory dist > /tmp/arranger-server.log 2>&1 &
          node scripts/browser-export-regression.cjs
          ARRANGER_URL='http://127.0.0.1:8080/arranger/?mode=explore' node arranger/tests/browser.test.cjs
          ARRANGER_URL='http://127.0.0.1:8080/arranger/?mode=beginner' node arranger/tests/onebar-reharm-browser.test.cjs
          node arranger/tests/v05-browser.test.cjs
          node arranger/tests/v06-browser.test.cjs
          node arranger/tests/pwa-update.test.cjs

      - name: Upload mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arranger-mobile-evidence
          path: test-results/

name: Demo Composer CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax check
        run: npm run test:syntax

      - name: MIDI smoke test
        run: npm run test:midi

      - name: Rhythm copy smoke test
        run: npm run test:rhythm

      - name: Rhythm preset smoke test
        run: npm run test:rhythm-presets

      - name: Melody grid smoke test
        run: npm run test:melody

      - name: Chord types smoke test
        run: npm run test:chord

      - name: Chord preset smoke test
        run: npm run test:chord-presets

      - name: Hub key-change smoke test
        run: npm run test:key-change

      - name: Diatonic fan smoke test
        run: npm run test:diatonic-fan

      - name: History (Undo / Redo) smoke test
        run: npm run test:history

      - name: Section (Arrange) smoke test
        run: npm run test:section

      - name: Static build
        run: npm run build

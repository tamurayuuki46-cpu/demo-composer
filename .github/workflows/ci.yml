name: Demo Composer CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax check
        run: npm run test:syntax

      - name: MIDI smoke test
        run: npm run test:midi

      - name: Rhythm copy smoke test
        run: npm run test:rhythm

      - name: Rhythm preset smoke test
        run: npm run test:rhythm-presets

      - name: Melody grid smoke test
        run: npm run test:melody

      - name: Chord types smoke test
        run: npm run test:chord

      - name: Chord preset smoke test
        run: npm run test:chord-presets

      - name: Backing pattern smoke test
        run: npm run test:backing

      - name: Hub key-change smoke test
        run: npm run test:key-change

      - name: Diatonic fan smoke test
        run: npm run test:diatonic-fan

      - name: History (Undo / Redo) smoke test
        run: npm run test:history

      - name: Section (Arrange) smoke test
        run: npm run test:section

      - name: Sound Sketch smoke test
        run: npm run test:sound

      - name: Part switch (mute / solo) smoke test
        run: npm run test:parts

      - name: AI consult text smoke test
        run: npm run test:consult

      - name: Next chord / bass candidates smoke test
        run: npm run test:candidates

      - name: Cubase memo / consult template smoke test
        run: npm run test:memo

      - name: Melody analysis smoke test
        run: npm run test:analysis

      - name: Starting point smoke test
        run: npm run test:starting-point

      - name: Display settings smoke test
        run: npm run test:display

      - name: project.json import smoke test
        run: npm run test:import

      - name: Static build
        run: npm run build

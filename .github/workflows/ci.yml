name: Demo Composer CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: MIDI smoke test
        run: npm run test:midi

      - name: Rhythm copy smoke test
        run: npm run test:rhythm

      - name: Melody grid smoke test
        run: npm run test:melody

      - name: Chord types smoke test
        run: npm run test:chord

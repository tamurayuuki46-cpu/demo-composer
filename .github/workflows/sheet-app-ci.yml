name: Composition Sheet CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'sheet-app/**'
      - 'src/shared/song-project.js'
      - 'src/shared/song-data-menu.js'
      - 'scripts/composition-sheet-app-smoke-test.mjs'
      - 'scripts/composition-sheet-full*'
      - 'docs/sheet/**'
      - 'scripts/song-project-sheet-roundtrip-smoke-test.mjs'
      - 'scripts/build-static.mjs'
      - '.github/workflows/sheet-app-ci.yml'

jobs:
  sheet-app-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Composition Sheet smoke test
        run: node scripts/composition-sheet-app-smoke-test.mjs

      - name: Composition Sheet to Demo Composer roundtrip
        run: node scripts/song-project-sheet-roundtrip-smoke-test.mjs

      - name: Full workbook source and round-trip
        run: node scripts/composition-sheet-full-smoke-test.mjs

      - name: Static build
        run: npm run build

      - name: Verify Composition Sheet build output
        run: |
          test -f dist/sheet-app/versions/v0.4/composition_sheet_v0.4.html
          test -f dist/sheet-app/versions/v0.4/sheet_content_v0.4.js
          test -f dist/sheet-app/index.html
          test -f dist/sheet-app/latest/composition_sheet_latest.html
          test -f dist/sheet-app/versions/v0.1/composition_sheet_v0.1.html
          test -f dist/sheet-app/versions/v0.2/composition_sheet_v0.2.html
          test -f dist/sheet-app/versions/v0.2/composition_sheet_v0.2.js
          test -f dist/sheet-app/versions/v0.3/composition_sheet_v0.3.html
          test -f dist/sheet-app/versions/v0.3/composition_sheet_v0.3.js
          grep -q 'まずは、2項目だけ。' dist/sheet-app/versions/v0.3/composition_sheet_v0.3.html
          grep -q 'SongProject v1' dist/sheet-app/versions/v0.3/composition_sheet_v0.3.html
          grep -q 'song-data-menu.js?build=' dist/sheet-app/versions/v0.3/composition_sheet_v0.3.js

      - name: Full workbook Chromium mobile and desktop
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --directory dist > /tmp/sheet-server.log 2>&1 &
          node scripts/composition-sheet-full-browser.test.cjs
          node scripts/composition-sheet-tabs-browser.test.cjs
          node arranger/tests/song-data-menu-browser.test.cjs

      - name: Upload full workbook browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-sheet-full-evidence
          path: test-results/

name: Composition Sheet CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'sheet-app/**'
      - 'src/shared/song-project.js'
      - 'src/shared/song-data-menu.js'
      - 'scripts/composition-sheet-app-smoke-test.mjs'
      - 'scripts/composition-sheet-full*'
      - 'scripts/composition-sheet-v06*'
      - 'scripts/composition-sheet-v08*'
      - 'scripts/composition-sheet-v09*'
      - 'scripts/composition-sheet-tabs*'
      - 'arranger/tests/song-data-menu-browser.test.cjs'
      - 'docs/sheet/**'
      - 'scripts/song-project-sheet-roundtrip-smoke-test.mjs'
      - 'scripts/build-static.mjs'
      - '.github/workflows/sheet-app-ci.yml'

jobs:
  sheet-app-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Composition Sheet smoke test
        run: node scripts/composition-sheet-app-smoke-test.mjs

      - name: Composition Sheet to Demo Composer roundtrip
        run: node scripts/song-project-sheet-roundtrip-smoke-test.mjs

      - name: Full workbook source and round-trip
        run: |
          node scripts/composition-sheet-full-smoke-test.mjs
          node scripts/composition-sheet-summary-smoke-test.mjs
          node scripts/composition-sheet-v08-manual-ideas.test.mjs

      - name: Static build
        run: npm run build

      - name: Verify Composition Sheet build output
        run: |
          test -f dist/sheet-app/versions/v0.4/composition_sheet_v0.4.html
          test -f dist/sheet-app/versions/v0.4/sheet_content_v0.4.js
          test -f dist/sheet-app/index.html
          test -f dist/sheet-app/latest/composition_sheet_latest.html
          test -f dist/sheet-app/latest/manifest.json
          test -f dist/sheet-app/versions/v0.1/composition_sheet_v0.1.html
          test -f dist/sheet-app/versions/v0.2/composition_sheet_v0.2.html
          test -f dist/sheet-app/versions/v0.2/composition_sheet_v0.2.js
          test -f dist/sheet-app/versions/v0.3/composition_sheet_v0.3.html
          test -f dist/sheet-app/versions/v0.3/composition_sheet_v0.3.js
          test -f dist/sheet-app/versions/v0.8/composition_sheet_v0.8.html
          test -f dist/sheet-app/versions/v0.8/composition_sheet_v0.8.js
          test -f dist/sheet-app/versions/v0.8/manual_ideas_v0.8.js
          test -f dist/sheet-app/versions/v0.9/composition_sheet_v0.9.html
          test -f dist/sheet-app/versions/v0.9/composition_sheet_v0.9.js
          test -f dist/sheet-app/versions/v0.9/composition_sheet_v0.9.css
          test -f dist/sheet-app/versions/v0.9.1/composition_sheet_v0.9.1.html
          test -f dist/sheet-app/versions/v0.9.1/composition_sheet_v0.9.1.js
          test -f dist/sheet-app/versions/v0.9.1/composition_sheet_v0.9.1.css
          grep -q 'まずは、2項目だけ。' dist/sheet-app/versions/v0.3/composition_sheet_v0.3.html
          grep -q 'SongProject v1' dist/sheet-app/versions/v0.3/composition_sheet_v0.3.html
          grep -q 'song-data-menu.js?build=' dist/sheet-app/versions/v0.3/composition_sheet_v0.3.js
          grep -q 'versions/v0.9.1/composition_sheet_v0.9.1.html' dist/sheet-app/latest/composition_sheet_latest.html
          grep -q '"version": "v0.9.1-dev"' dist/sheet-app/latest/manifest.json
          grep -q 'id="beginner-card"' dist/sheet-app/versions/v0.9.1/composition_sheet_v0.9.1.html
          grep -q 'data-sheet-embed="1"' dist/sheet-app/versions/v0.9.1/composition_sheet_v0.9.1.css

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --directory dist > /tmp/sheet-server.log 2>&1 &

      - name: Full workbook v0.4 browser regression
        run: node scripts/composition-sheet-full-browser.test.cjs

      - name: Sheet tabs browser regression
        run: node scripts/composition-sheet-tabs-browser.test.cjs

      - name: v0.6 browser regression
        run: node scripts/composition-sheet-v06-browser.test.cjs

      - name: v0.8 browser regression
        run: node scripts/composition-sheet-v08-browser.test.cjs

      - name: v0.9 browser regression
        run: node scripts/composition-sheet-v09-browser.test.cjs

      - name: v0.9.1 beginner and embed regression
        run: node scripts/composition-sheet-v091-browser.test.cjs

      - name: Song data menu browser regression
        run: node arranger/tests/song-data-menu-browser.test.cjs

      - name: Upload full workbook browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-sheet-full-evidence
          path: test-results/

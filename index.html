<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Demo Composer</title>
  <link rel="manifest" href="./public/manifest.webmanifest" />
  <link rel="stylesheet" href="./src/core/app.css" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Demo Composer</p>
        <h1>Untitled Project</h1>
      </div>
      <span class="version">v0.1-dev</span>
    </header>

    <section id="screen" class="screen" aria-live="polite"></section>

    <section id="demo-player" class="demo-player" aria-label="Demo Player">
      <button id="player-play" class="player-main" aria-label="再生">▶</button>
      <button id="player-stop" aria-label="停止">■</button>
      <button id="player-loop" aria-pressed="false">Loop</button>
      <div class="player-position">
        <progress id="player-progress" max="1" value="0"></progress>
        <span id="player-time">0:00 / 0:00</span>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="主要モジュール">
      <button data-screen="hub" class="nav-btn active">Hub</button>
      <button data-screen="chord" class="nav-btn">Chord</button>
      <button data-screen="melody" class="nav-btn">Melody</button>
      <button data-screen="rhythm" class="nav-btn">Rhythm</button>
    </nav>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
